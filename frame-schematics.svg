<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 2010" font-family="'Courier New', monospace">
  <defs>
    <marker id="tk" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M1,7 L7,1" stroke="#1D5FAF" stroke-width="1.4"/>
    </marker>
    <pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#8FA3B8" stroke-width="1"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="880" height="2010" fill="#EDF0EE"/>
  <rect x="20" y="20" width="840" height="1970" fill="none" stroke="#22303A" stroke-width="2"/>

  <!-- Title block -->
  <text x="50" y="62" font-family="Georgia, serif" font-size="26" fill="#22303A" font-weight="bold">8&#215;10 CANVAS FRAME &#8212; SHOP DRAWINGS (REV. B)</text>
  <text x="50" y="88" font-size="13" fill="#44525E">Box-style profile: 3/4" face to the front, 1-3/4" deep sides &#183; panel in through-dado &#183; 45&#176; miters &#183; run of 1,500</text>
  <line x1="50" y1="104" x2="830" y2="104" stroke="#22303A" stroke-width="1"/>

  <!-- ============ S1: RIP DIAGRAM ============ -->
  <text x="50" y="140" font-size="15" fill="#22303A" font-weight="bold">1 &#8212; RIP LAYOUT (end view of 1&#215;6) &#8212; unchanged</text>
  <rect x="80" y="165" width="98" height="42" fill="#F8F6EE" stroke="#22303A" stroke-width="1.5"/>
  <rect x="185" y="165" width="98" height="42" fill="#F8F6EE" stroke="#22303A" stroke-width="1.5"/>
  <rect x="290" y="165" width="98" height="42" fill="#F8F6EE" stroke="#22303A" stroke-width="1.5"/>
  <rect x="178" y="165" width="7" height="42" fill="url(#hatch)"/>
  <rect x="283" y="165" width="7" height="42" fill="url(#hatch)"/>
  <line x1="80" y1="232" x2="178" y2="232" stroke="#1D5FAF" stroke-width="1" marker-start="url(#tk)" marker-end="url(#tk)"/>
  <text x="106" y="248" font-size="12" fill="#1D5FAF">1-3/4"</text>
  <line x1="185" y1="232" x2="283" y2="232" stroke="#1D5FAF" stroke-width="1" marker-start="url(#tk)" marker-end="url(#tk)"/>
  <text x="211" y="248" font-size="12" fill="#1D5FAF">1-3/4"</text>
  <line x1="290" y1="232" x2="388" y2="232" stroke="#1D5FAF" stroke-width="1" marker-start="url(#tk)" marker-end="url(#tk)"/>
  <text x="316" y="248" font-size="12" fill="#1D5FAF">1-3/4"</text>
  <line x1="80" y1="264" x2="388" y2="264" stroke="#1D5FAF" stroke-width="1" marker-start="url(#tk)" marker-end="url(#tk)"/>
  <text x="196" y="280" font-size="12" fill="#1D5FAF">5-1/2" overall</text>
  <text x="410" y="182" font-size="12" fill="#44525E">2 rip cuts, 1/8" kerf each</text>
  <text x="410" y="198" font-size="12" fill="#44525E">3 strips per board &#8212; no width waste</text>

  <!-- ============ S2: STRIP PROFILE (rotated) ============ -->
  <text x="50" y="330" font-size="15" fill="#22303A" font-weight="bold">2 &#8212; STRIP PROFILE w/ DADO (end view &#8212; strip stands on edge)</text>
  <!-- 3/4 wide x 1-3/4 tall @56px/in = 42 x 98 at (150,360). Dado in right (inside) face -->
  <path d="M150,360 L192,360 L192,404 L171,404 L171,414 L192,414 L192,458 L150,458 Z" fill="#F8F6EE" stroke="#22303A" stroke-width="1.5"/>
  <rect x="171" y="404" width="21" height="10" fill="url(#hatch)"/>
  <rect x="171" y="404.5" width="130" height="9" fill="none" stroke="#8A5A24" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="310" y="412" font-size="12" fill="#8A5A24">8"&#215;10" backing board</text>
  <!-- labels -->
  <text x="70" y="356" font-size="12" fill="#44525E">FRONT of frame &#9660;</text>
  <line x1="150" y1="336" x2="192" y2="336" stroke="#1D5FAF" stroke-width="1" marker-start="url(#tk)" marker-end="url(#tk)"/>
  <text x="200" y="340" font-size="12" fill="#1D5FAF">3/4" (visible face width)</text>
  <line x1="120" y1="360" x2="120" y2="458" stroke="#1D5FAF" stroke-width="1" marker-start="url(#tk)" marker-end="url(#tk)"/>
  <text x="52" y="414" font-size="12" fill="#1D5FAF">1-3/4"</text>
  <text x="46" y="430" font-size="12" fill="#1D5FAF">(outside</text>
  <text x="58" y="446" font-size="12" fill="#1D5FAF">edge)</text>
  <line x1="222" y1="360" x2="222" y2="409" stroke="#1D5FAF" stroke-width="1" marker-start="url(#tk)" marker-end="url(#tk)"/>
  <text x="232" y="382" font-size="12" fill="#1D5FAF">7/8" to dado centerline</text>
  <text x="232" y="446" font-size="12" fill="#1D5FAF">dado 3/8" deep into the</text>
  <text x="232" y="462" font-size="12" fill="#1D5FAF">inside face, width = backing</text>
  <text x="80" y="500" font-size="12" fill="#44525E">Dado centered in the 1-3/4" face &#8594; strip is symmetric front-to-back, so flip-nested chain cutting (Sec. 6) still works.</text>

  <!-- ============ S3: LONG RAIL ============ -->
  <text x="50" y="560" font-size="15" fill="#22303A" font-weight="bold">3 &#8212; LONG RAIL &#8212; CUT 2 PER FRAME (3,000 total)</text>
  <!-- front view @28px/in: LP 10.75 = 301, width 0.75 = 21 -->
  <text x="80" y="590" font-size="11" fill="#607283">FRONT VIEW</text>
  <line x1="80" y1="606" x2="381" y2="606" stroke="#1D5FAF" stroke-width="1" marker-start="url(#tk)" marker-end="url(#tk)"/>
  <text x="160" y="600" font-size="12" fill="#1D5FAF">10-3/4" (long point to long point)</text>
  <polygon points="80,618 381,618 360,639 101,639" fill="#F8F6EE" stroke="#22303A" stroke-width="1.5"/>
  <line x1="101" y1="662" x2="360" y2="662" stroke="#1D5FAF" stroke-width="1" marker-start="url(#tk)" marker-end="url(#tk)"/>
  <text x="170" y="678" font-size="12" fill="#1D5FAF">9-1/4" (short point)</text>
  <line x1="410" y1="618" x2="410" y2="639" stroke="#1D5FAF" stroke-width="1" marker-start="url(#tk)" marker-end="url(#tk)"/>
  <text x="420" y="632" font-size="12" fill="#1D5FAF">3/4" &#183; 45&#176; both ends</text>
  <!-- inside-face view -->
  <text x="101" y="706" font-size="11" fill="#607283">INSIDE-FACE VIEW (rectangle &#8212; miters are square to this face)</text>
  <rect x="101" y="714" width="259" height="49" fill="#F8F6EE" stroke="#22303A" stroke-width="1.5"/>
  <rect x="101" y="733.5" width="259" height="10" fill="url(#hatch)"/>
  <line x1="101" y1="733.5" x2="360" y2="733.5" stroke="#22303A" stroke-width="0.8"/>
  <line x1="101" y1="743.5" x2="360" y2="743.5" stroke="#22303A" stroke-width="0.8"/>
  <text x="380" y="742" font-size="12" fill="#44525E">dado runs full length,</text>
  <text x="380" y="758" font-size="12" fill="#44525E">exits at the miter faces</text>

  <!-- ============ S4: SHORT RAIL ============ -->
  <text x="50" y="826" font-size="15" fill="#22303A" font-weight="bold">4 &#8212; SHORT RAIL &#8212; CUT 2 PER FRAME (3,000 total)</text>
  <text x="80" y="856" font-size="11" fill="#607283">FRONT VIEW</text>
  <line x1="80" y1="872" x2="325" y2="872" stroke="#1D5FAF" stroke-width="1" marker-start="url(#tk)" marker-end="url(#tk)"/>
  <text x="130" y="866" font-size="12" fill="#1D5FAF">8-3/4" (long point to long point)</text>
  <polygon points="80,884 325,884 304,905 101,905" fill="#F8F6EE" stroke="#22303A" stroke-width="1.5"/>
  <line x1="101" y1="928" x2="304" y2="928" stroke="#1D5FAF" stroke-width="1" marker-start="url(#tk)" marker-end="url(#tk)"/>
  <text x="150" y="944" font-size="12" fill="#1D5FAF">7-1/4" (short point)</text>
  <line x1="354" y1="884" x2="354" y2="905" stroke="#1D5FAF" stroke-width="1" marker-start="url(#tk)" marker-end="url(#tk)"/>
  <text x="364" y="898" font-size="12" fill="#1D5FAF">3/4" &#183; 45&#176; both ends</text>
  <text x="101" y="972" font-size="11" fill="#607283">INSIDE-FACE VIEW</text>
  <rect x="101" y="980" width="203" height="49" fill="#F8F6EE" stroke="#22303A" stroke-width="1.5"/>
  <rect x="101" y="999.5" width="203" height="10" fill="url(#hatch)"/>
  <line x1="101" y1="999.5" x2="304" y2="999.5" stroke="#22303A" stroke-width="0.8"/>
  <line x1="101" y1="1009.5" x2="304" y2="1009.5" stroke="#22303A" stroke-width="0.8"/>

  <!-- ============ S5: ASSEMBLED FRAME ============ -->
  <text x="50" y="1090" font-size="15" fill="#22303A" font-weight="bold">5 &#8212; ASSEMBLED FRAME (front view) &#8212; glue up AROUND the panel</text>
  <!-- OD 10.75 x 8.75 @28px/in = 301 x 245 at (110,1120) -->
  <rect x="110" y="1120" width="301" height="245" fill="#F8F6EE" stroke="#22303A" stroke-width="1.5"/>
  <rect x="131" y="1141" width="259" height="203" fill="#E2E7E4" stroke="#22303A" stroke-width="1.5"/>
  <line x1="110" y1="1120" x2="131" y2="1141" stroke="#22303A" stroke-width="1"/>
  <line x1="411" y1="1120" x2="390" y2="1141" stroke="#22303A" stroke-width="1"/>
  <line x1="110" y1="1365" x2="131" y2="1344" stroke="#22303A" stroke-width="1"/>
  <line x1="411" y1="1365" x2="390" y2="1344" stroke="#22303A" stroke-width="1"/>
  <rect x="120.5" y="1130.5" width="280" height="224" fill="none" stroke="#8A5A24" stroke-width="1.2" stroke-dasharray="6,4"/>
  <text x="170" y="1236" font-size="12" fill="#8A5A24">8" &#215; 10" panel (hidden)</text>
  <text x="170" y="1252" font-size="12" fill="#8A5A24">seated 3/8" into all four rails</text>
  <line x1="110" y1="1098" x2="411" y2="1098" stroke="#1D5FAF" stroke-width="1" marker-start="url(#tk)" marker-end="url(#tk)"/>
  <text x="210" y="1092" font-size="12" fill="#1D5FAF">10-3/4" O.D.</text>
  <line x1="436" y1="1120" x2="436" y2="1365" stroke="#1D5FAF" stroke-width="1" marker-start="url(#tk)" marker-end="url(#tk)"/>
  <text x="446" y="1246" font-size="12" fill="#1D5FAF">8-3/4" O.D.</text>
  <line x1="131" y1="1392" x2="390" y2="1392" stroke="#1D5FAF" stroke-width="1" marker-start="url(#tk)" marker-end="url(#tk)"/>
  <text x="170" y="1408" font-size="12" fill="#1D5FAF">opening 9-1/4" &#215; 7-1/4"</text>
  <text x="580" y="1140" font-size="12" fill="#44525E">Frame sits 1-3/4" proud of</text>
  <text x="580" y="1156" font-size="12" fill="#44525E">the wall &#8212; box/crate look,</text>
  <text x="580" y="1172" font-size="12" fill="#44525E">panel floats 7/8" back</text>
  <text x="580" y="1188" font-size="12" fill="#44525E">from the front face.</text>
  <text x="580" y="1220" font-size="12" fill="#44525E">Fit tip: cut panels 1/16"</text>
  <text x="580" y="1236" font-size="12" fill="#44525E">scant (or add 1/16" to rail</text>
  <text x="580" y="1252" font-size="12" fill="#44525E">lengths) so miters close.</text>

  <!-- ============ S6: NESTED CHAIN CUTTING ============ -->
  <text x="50" y="1470" font-size="15" fill="#22303A" font-weight="bold">6 &#8212; NESTED CHAIN CUTTING (flip the strip front-for-back between cuts)</text>
  <text x="50" y="1490" font-size="12" fill="#44525E">Strip lies on its 3/4" face at the saw. Alternate pieces point opposite ways so each cut finishes one piece and starts the next.</text>
  <!-- long-rail strip: 96" @7.5px/in = 720, height exaggerated -->
  <rect x="80" y="1510" width="720" height="36" fill="#F8F6EE" stroke="#22303A" stroke-width="1.2"/>
  <line x1="160.6" y1="1510" x2="155" y2="1546" stroke="#22303A" stroke-width="1"/>
  <line x1="230" y1="1510" x2="235.6" y2="1546" stroke="#22303A" stroke-width="1"/>
  <line x1="310.6" y1="1510" x2="305" y2="1546" stroke="#22303A" stroke-width="1"/>
  <line x1="380" y1="1510" x2="385.6" y2="1546" stroke="#22303A" stroke-width="1"/>
  <line x1="460.6" y1="1510" x2="455" y2="1546" stroke="#22303A" stroke-width="1"/>
  <line x1="530" y1="1510" x2="535.6" y2="1546" stroke="#22303A" stroke-width="1"/>
  <line x1="610.6" y1="1510" x2="605" y2="1546" stroke="#22303A" stroke-width="1"/>
  <line x1="680" y1="1510" x2="685.6" y2="1546" stroke="#22303A" stroke-width="1"/>
  <rect x="690" y="1510" width="30" height="36" fill="url(#hatch)"/>
  <text x="105" y="1533" font-size="11" fill="#44525E">1</text>
  <text x="185" y="1533" font-size="11" fill="#44525E">2</text>
  <text x="258" y="1533" font-size="11" fill="#44525E">3</text>
  <text x="335" y="1533" font-size="11" fill="#44525E">4</text>
  <text x="408" y="1533" font-size="11" fill="#44525E">5</text>
  <text x="485" y="1533" font-size="11" fill="#44525E">6</text>
  <text x="558" y="1533" font-size="11" fill="#44525E">7</text>
  <text x="635" y="1533" font-size="11" fill="#44525E">8</text>
  <text x="672" y="1533" font-size="11" fill="#44525E">9</text>
  <text x="80" y="1566" font-size="12" fill="#22303A">8-ft strip, LONG rails: 9 pieces, ~3.8" scrap (vs. 8 pieces cut all one direction)</text>
  <!-- short-rail strip -->
  <rect x="80" y="1586" width="720" height="36" fill="#F8F6EE" stroke="#22303A" stroke-width="1.2"/>
  <line x1="145.6" y1="1586" x2="140" y2="1622" stroke="#22303A" stroke-width="1"/>
  <line x1="200" y1="1586" x2="205.6" y2="1622" stroke="#22303A" stroke-width="1"/>
  <line x1="265.6" y1="1586" x2="260" y2="1622" stroke="#22303A" stroke-width="1"/>
  <line x1="320" y1="1586" x2="325.6" y2="1622" stroke="#22303A" stroke-width="1"/>
  <line x1="385.6" y1="1586" x2="380" y2="1622" stroke="#22303A" stroke-width="1"/>
  <line x1="440" y1="1586" x2="445.6" y2="1622" stroke="#22303A" stroke-width="1"/>
  <line x1="505.6" y1="1586" x2="500" y2="1622" stroke="#22303A" stroke-width="1"/>
  <line x1="560" y1="1586" x2="565.6" y2="1622" stroke="#22303A" stroke-width="1"/>
  <line x1="625.6" y1="1586" x2="620" y2="1622" stroke="#22303A" stroke-width="1"/>
  <line x1="680" y1="1586" x2="685.6" y2="1622" stroke="#22303A" stroke-width="1"/>
  <rect x="692" y="1586" width="28" height="36" fill="url(#hatch)"/>
  <text x="100" y="1609" font-size="11" fill="#44525E">1</text>
  <text x="165" y="1609" font-size="11" fill="#44525E">2</text>
  <text x="225" y="1609" font-size="11" fill="#44525E">3</text>
  <text x="285" y="1609" font-size="11" fill="#44525E">4</text>
  <text x="345" y="1609" font-size="11" fill="#44525E">5</text>
  <text x="405" y="1609" font-size="11" fill="#44525E">6</text>
  <text x="466" y="1609" font-size="11" fill="#44525E">7</text>
  <text x="525" y="1609" font-size="11" fill="#44525E">8</text>
  <text x="585" y="1609" font-size="11" fill="#44525E">9</text>
  <text x="640" y="1609" font-size="11" fill="#44525E">10</text>
  <text x="668" y="1609" font-size="11" fill="#44525E">11</text>
  <text x="80" y="1642" font-size="12" fill="#22303A">8-ft strip, SHORT rails: 11 pieces, ~5.5" scrap (vs. 10 pieces cut all one direction)</text>

  <!-- ============ S7: CUT PLAN ============ -->
  <text x="50" y="1700" font-size="15" fill="#22303A" font-weight="bold">7 &#8212; CUT PLAN FOR 1,500 FRAMES</text>
  <rect x="50" y="1716" width="780" height="254" fill="#F8F6EE" stroke="#22303A" stroke-width="1.2"/>
  <text x="70" y="1746" font-size="13" fill="#22303A">Stock: 1&#215;6 &#215; 8 ft clear pine &#8212; 203 boards net (812 board feet). Buy ~215 to cover knots, snipe, and miscuts.</text>
  <line x1="70" y1="1760" x2="810" y2="1760" stroke="#8FA3B8" stroke-width="1"/>
  <text x="70" y="1786" font-size="13" fill="#22303A">Step 1 &#8212; RIP: every board into three 1-3/4" strips (607 strips + 2 spare).</text>
  <text x="70" y="1810" font-size="13" fill="#22303A">Step 2 &#8212; DADO: 3/8"-deep groove, centered in the 1-3/4" face, on every strip. One setup, never changed.</text>
  <text x="70" y="1834" font-size="13" fill="#22303A">Step 3 &#8212; MITER, nested (Sec. 6), two stop-block settings only:</text>
  <text x="100" y="1858" font-size="13" fill="#22303A">&#8226; 334 strips @ 9 long rails each (10-3/4" LP)  = 3,006 long rails</text>
  <text x="100" y="1882" font-size="13" fill="#22303A">&#8226; 273 strips @ 11 short rails each (8-3/4" LP) = 3,003 short rails</text>
  <text x="70" y="1912" font-size="13" fill="#22303A">Length waste &#8776; 4.7% &#183; width waste: zero beyond the two 1/8" rip kerfs.</text>
  <text x="70" y="1936" font-size="13" fill="#607283">If your yard stocks 12-footers: 14 long rails/strip (under 1" scrap!) + 17 short/strip &#8594; only 131 boards (786 bd ft).</text>
</svg>
