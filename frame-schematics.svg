<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 2100" font-family="'Courier New', monospace">
  <defs>
    <marker id="tk" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M1,7 L7,1" stroke="#1D5FAF" stroke-width="1.4"/>
    </marker>
    <pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#8FA3B8" stroke-width="1"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="880" height="2100" fill="#EDF0EE"/>
  <rect x="20" y="20" width="840" height="2060" fill="none" stroke="#22303A" stroke-width="2"/>

  <text x="50" y="62" font-family="Georgia, serif" font-size="26" fill="#22303A" font-weight="bold">FRAME SIZE EXTENSIONS &#8212; 7&#215;7, 16&#215;20, 24&#215;30</text>
  <text x="50" y="88" font-size="13" fill="#44525E">Same Rev. B profile throughout: 3/4" face &#183; 1-3/4" deep &#183; 3/8" centered dado &#183; 45&#176; miters &#183; 1,500 frames of each size</text>
  <line x1="50" y1="104" x2="830" y2="104" stroke="#22303A" stroke-width="1"/>

  <!-- ============ S1: SHARED PROFILE + FORMULA ============ -->
  <text x="50" y="140" font-size="15" fill="#22303A" font-weight="bold">1 &#8212; ONE PROFILE FITS ALL (end view)</text>
  <path d="M90,165 L132,165 L132,209 L111,209 L111,219 L132,219 L132,263 L90,263 Z" fill="#F8F6EE" stroke="#22303A" stroke-width="1.5"/>
  <rect x="111" y="209" width="21" height="10" fill="url(#hatch)"/>
  <text x="90" y="285" font-size="11" fill="#607283">3/4" &#215; 1-3/4", dado 3/8" deep,</text>
  <text x="90" y="300" font-size="11" fill="#607283">centered (7/8" from front)</text>
  <text x="230" y="180" font-size="13" fill="#22303A">Every rail, any panel size, follows one rule:</text>
  <text x="230" y="210" font-size="14" fill="#1D5FAF" font-weight="bold">LONG POINT  = panel dimension + 3/4"</text>
  <text x="230" y="234" font-size="14" fill="#1D5FAF" font-weight="bold">SHORT POINT = panel dimension &#8722; 3/4"</text>
  <text x="230" y="264" font-size="12" fill="#44525E">(panel + two 3/4" faces &#8722; two 3/8" dado seats). Rip, dado, and</text>
  <text x="230" y="280" font-size="12" fill="#44525E">flip-nest chain cutting are identical to the 8&#215;10 run &#8212; strips are</text>
  <text x="230" y="296" font-size="12" fill="#44525E">interchangeable between sizes until they hit the miter saw.</text>

  <!-- ============ S2: RAIL CUTTING LIST (to scale, 22px/in) ============ -->
  <text x="50" y="346" font-size="15" fill="#22303A" font-weight="bold">2 &#8212; RAIL CUTTING LIST (drawn to a common scale)</text>

  <!-- 7x7 rail: LP 7.75 -> 170.5 -->
  <polygon points="80,380 250.5,380 234,396.5 96.5,396.5" fill="#F8F6EE" stroke="#22303A" stroke-width="1.5"/>
  <text x="270" y="386" font-size="13" fill="#22303A" font-weight="bold">7&#215;7 rail &#8212; cut 4 per frame (all identical): 6,000 pcs</text>
  <text x="270" y="404" font-size="12" fill="#1D5FAF">LP 7-3/4" / SP 6-1/4"</text>

  <!-- 16x20 short: LP 16.75 -> 368.5 -->
  <polygon points="80,450 448.5,450 432,466.5 96.5,466.5" fill="#F8F6EE" stroke="#22303A" stroke-width="1.5"/>
  <text x="470" y="456" font-size="13" fill="#22303A" font-weight="bold">16&#215;20 short rail &#8212; 2/frame: 3,000 pcs</text>
  <text x="470" y="474" font-size="12" fill="#1D5FAF">LP 16-3/4" / SP 15-1/4"</text>

  <!-- 16x20 long: LP 20.75 -> 456.5 -->
  <polygon points="80,520 536.5,520 520,536.5 96.5,536.5" fill="#F8F6EE" stroke="#22303A" stroke-width="1.5"/>
  <text x="558" y="526" font-size="13" fill="#22303A" font-weight="bold">16&#215;20 long rail &#8212; 2/frame: 3,000 pcs</text>
  <text x="558" y="544" font-size="12" fill="#1D5FAF">LP 20-3/4" / SP 19-1/4"</text>

  <!-- 24x30 short: LP 24.75 -> 544.5 -->
  <polygon points="80,590 624.5,590 608,606.5 96.5,606.5" fill="#F8F6EE" stroke="#22303A" stroke-width="1.5"/>
  <text x="646" y="596" font-size="13" fill="#22303A" font-weight="bold">24&#215;30 short rail &#8212; 2/frame:</text>
  <text x="646" y="612" font-size="13" fill="#22303A" font-weight="bold">3,000 pcs</text>
  <text x="646" y="630" font-size="12" fill="#1D5FAF">LP 24-3/4" / SP 23-1/4"</text>

  <!-- 24x30 long: LP 30.75 -> 676.5 -->
  <polygon points="80,660 756.5,660 740,676.5 96.5,676.5" fill="#F8F6EE" stroke="#22303A" stroke-width="1.5"/>
  <text x="80" y="706" font-size="13" fill="#22303A" font-weight="bold">24&#215;30 long rail &#8212; 2/frame: 3,000 pcs</text>
  <text x="370" y="706" font-size="12" fill="#1D5FAF">LP 30-3/4" / SP 29-1/4"</text>

  <!-- ============ S3: ASSEMBLED FRAMES, common scale ============ -->
  <text x="50" y="760" font-size="15" fill="#22303A" font-weight="bold">3 &#8212; ASSEMBLED FRAMES (front views, common scale)</text>
  <!-- 9px/in, bottoms aligned at y=1090 -->
  <!-- 7x7: OD 70x70 at (80,1020) -->
  <rect x="80" y="1020" width="70" height="70" fill="#F8F6EE" stroke="#22303A" stroke-width="1.5"/>
  <rect x="87" y="1027" width="56" height="56" fill="#E2E7E4" stroke="#22303A" stroke-width="1"/>
  <line x1="80" y1="1020" x2="87" y2="1027" stroke="#22303A" stroke-width="0.8"/>
  <line x1="150" y1="1020" x2="143" y2="1027" stroke="#22303A" stroke-width="0.8"/>
  <line x1="80" y1="1090" x2="87" y2="1083" stroke="#22303A" stroke-width="0.8"/>
  <line x1="150" y1="1090" x2="143" y2="1083" stroke="#22303A" stroke-width="0.8"/>
  <text x="80" y="1112" font-size="12" fill="#22303A" font-weight="bold">7&#215;7</text>
  <text x="80" y="1130" font-size="11" fill="#1D5FAF">O.D. 7-3/4" sq</text>
  <text x="80" y="1146" font-size="11" fill="#1D5FAF">opening 6-1/4" sq</text>

  <!-- 16x20: OD 151x187 at (210,903) -->
  <rect x="210" y="903" width="151" height="187" fill="#F8F6EE" stroke="#22303A" stroke-width="1.5"/>
  <rect x="217" y="910" width="137" height="173" fill="#E2E7E4" stroke="#22303A" stroke-width="1"/>
  <line x1="210" y1="903" x2="217" y2="910" stroke="#22303A" stroke-width="0.8"/>
  <line x1="361" y1="903" x2="354" y2="910" stroke="#22303A" stroke-width="0.8"/>
  <line x1="210" y1="1090" x2="217" y2="1083" stroke="#22303A" stroke-width="0.8"/>
  <line x1="361" y1="1090" x2="354" y2="1083" stroke="#22303A" stroke-width="0.8"/>
  <text x="210" y="1112" font-size="12" fill="#22303A" font-weight="bold">16&#215;20</text>
  <text x="210" y="1130" font-size="11" fill="#1D5FAF">O.D. 16-3/4" &#215; 20-3/4"</text>
  <text x="210" y="1146" font-size="11" fill="#1D5FAF">opening 15-1/4" &#215; 19-1/4"</text>

  <!-- 24x30: OD 223x277 at (430,813) -->
  <rect x="430" y="813" width="223" height="277" fill="#F8F6EE" stroke="#22303A" stroke-width="1.5"/>
  <rect x="437" y="820" width="209" height="263" fill="#E2E7E4" stroke="#22303A" stroke-width="1"/>
  <line x1="430" y1="813" x2="437" y2="820" stroke="#22303A" stroke-width="0.8"/>
  <line x1="653" y1="813" x2="646" y2="820" stroke="#22303A" stroke-width="0.8"/>
  <line x1="430" y1="1090" x2="437" y2="1083" stroke="#22303A" stroke-width="0.8"/>
  <line x1="653" y1="1090" x2="646" y2="1083" stroke="#22303A" stroke-width="0.8"/>
  <text x="430" y="1112" font-size="12" fill="#22303A" font-weight="bold">24&#215;30</text>
  <text x="430" y="1130" font-size="11" fill="#1D5FAF">O.D. 24-3/4" &#215; 30-3/4"</text>
  <text x="430" y="1146" font-size="11" fill="#1D5FAF">opening 23-1/4" &#215; 29-1/4"</text>
  <text x="680" y="900" font-size="11" fill="#44525E">Panels seat 3/8" into</text>
  <text x="680" y="916" font-size="11" fill="#44525E">all rails; frames glue</text>
  <text x="680" y="932" font-size="11" fill="#44525E">up around the panel.</text>
  <text x="680" y="962" font-size="11" fill="#44525E">24&#215;30 tip: add corner</text>
  <text x="680" y="978" font-size="11" fill="#44525E">splines or v-nails &#8212; a</text>
  <text x="680" y="994" font-size="11" fill="#44525E">3/4" glue face is slim</text>
  <text x="680" y="1010" font-size="11" fill="#44525E">for a frame this big.</text>

  <!-- ============ S4: STRIP PATTERNS ============ -->
  <text x="50" y="1200" font-size="15" fill="#22303A" font-weight="bold">4 &#8212; STRIP PATTERNS (nested chain cuts, flip every piece)</text>

  <text x="80" y="1230" font-size="12" fill="#22303A" font-weight="bold">7&#215;7 &#8212; 8-ft strip: 13 rails</text>
  <rect x="80" y="1240" width="720" height="30" fill="#F8F6EE" stroke="#22303A" stroke-width="1.2"/>
  <line x1="133" y1="1240" x2="133" y2="1270" stroke="#22303A" stroke-width="0.8"/>
  <line x1="186" y1="1240" x2="186" y2="1270" stroke="#22303A" stroke-width="0.8"/>
  <line x1="239" y1="1240" x2="239" y2="1270" stroke="#22303A" stroke-width="0.8"/>
  <line x1="292" y1="1240" x2="292" y2="1270" stroke="#22303A" stroke-width="0.8"/>
  <line x1="345" y1="1240" x2="345" y2="1270" stroke="#22303A" stroke-width="0.8"/>
  <line x1="398" y1="1240" x2="398" y2="1270" stroke="#22303A" stroke-width="0.8"/>
  <line x1="451" y1="1240" x2="451" y2="1270" stroke="#22303A" stroke-width="0.8"/>
  <line x1="504" y1="1240" x2="504" y2="1270" stroke="#22303A" stroke-width="0.8"/>
  <line x1="557" y1="1240" x2="557" y2="1270" stroke="#22303A" stroke-width="0.8"/>
  <line x1="610" y1="1240" x2="610" y2="1270" stroke="#22303A" stroke-width="0.8"/>
  <line x1="663" y1="1240" x2="663" y2="1270" stroke="#22303A" stroke-width="0.8"/>
  <line x1="689" y1="1240" x2="689" y2="1270" stroke="#22303A" stroke-width="0.8"/>
  <rect x="689" y="1240" width="31" height="30" fill="url(#hatch)"/>
  <text x="80" y="1292" font-size="12" fill="#44525E">13 &#215; 7-3/4" LP &#183; ~2" scrap &#183; one stop block for the entire size</text>

  <text x="80" y="1330" font-size="12" fill="#22303A" font-weight="bold">16&#215;20 &#8212; 8-ft strips, two alternating patterns (keeps shorts and longs 1:1)</text>
  <rect x="80" y="1340" width="720" height="30" fill="#F8F6EE" stroke="#22303A" stroke-width="1.2"/>
  <line x1="201" y1="1340" x2="201" y2="1370" stroke="#22303A" stroke-width="0.8"/>
  <line x1="352" y1="1340" x2="352" y2="1370" stroke="#22303A" stroke-width="0.8"/>
  <line x1="473" y1="1340" x2="473" y2="1370" stroke="#22303A" stroke-width="0.8"/>
  <line x1="624" y1="1340" x2="624" y2="1370" stroke="#22303A" stroke-width="0.8"/>
  <line x1="671" y1="1340" x2="671" y2="1370" stroke="#22303A" stroke-width="0.8"/>
  <rect x="671" y="1340" width="49" height="30" fill="url(#hatch)"/>
  <text x="125" y="1360" font-size="11" fill="#44525E">S</text><text x="262" y="1360" font-size="11" fill="#44525E">L</text><text x="398" y="1360" font-size="11" fill="#44525E">S</text><text x="534" y="1360" font-size="11" fill="#44525E">L</text><text x="642" y="1360" font-size="11" fill="#44525E">S</text>
  <rect x="80" y="1378" width="720" height="30" fill="#F8F6EE" stroke="#22303A" stroke-width="1.2"/>
  <line x1="231" y1="1378" x2="231" y2="1408" stroke="#22303A" stroke-width="0.8"/>
  <line x1="352" y1="1378" x2="352" y2="1408" stroke="#22303A" stroke-width="0.8"/>
  <line x1="503" y1="1378" x2="503" y2="1408" stroke="#22303A" stroke-width="0.8"/>
  <line x1="624" y1="1378" x2="624" y2="1408" stroke="#22303A" stroke-width="0.8"/>
  <line x1="700" y1="1378" x2="700" y2="1408" stroke="#22303A" stroke-width="0.8"/>
  <rect x="700" y="1378" width="20" height="30" fill="url(#hatch)"/>
  <text x="140" y="1398" font-size="11" fill="#44525E">L</text><text x="286" y="1398" font-size="11" fill="#44525E">S</text><text x="422" y="1398" font-size="11" fill="#44525E">L</text><text x="558" y="1398" font-size="11" fill="#44525E">S</text><text x="656" y="1398" font-size="11" fill="#44525E">L</text>
  <text x="80" y="1430" font-size="12" fill="#44525E">Pattern A: S-L-S-L-S (3 shorts, 2 longs, ~6.5" scrap) &#183; Pattern B: L-S-L-S-L (2 shorts, 3 longs, ~2.5" scrap)</text>

  <text x="80" y="1468" font-size="12" fill="#22303A" font-weight="bold">24&#215;30 &#8212; 12-ft strips, two alternating patterns</text>
  <rect x="80" y="1478" width="720" height="30" fill="#F8F6EE" stroke="#22303A" stroke-width="1.2"/>
  <line x1="231" y1="1478" x2="231" y2="1508" stroke="#22303A" stroke-width="0.8"/>
  <line x1="352" y1="1478" x2="352" y2="1508" stroke="#22303A" stroke-width="0.8"/>
  <line x1="503" y1="1478" x2="503" y2="1508" stroke="#22303A" stroke-width="0.8"/>
  <line x1="624" y1="1478" x2="624" y2="1508" stroke="#22303A" stroke-width="0.8"/>
  <line x1="698" y1="1478" x2="698" y2="1508" stroke="#22303A" stroke-width="0.8"/>
  <rect x="698" y="1478" width="22" height="30" fill="url(#hatch)"/>
  <text x="140" y="1498" font-size="11" fill="#44525E">L</text><text x="286" y="1498" font-size="11" fill="#44525E">S</text><text x="422" y="1498" font-size="11" fill="#44525E">L</text><text x="558" y="1498" font-size="11" fill="#44525E">S</text><text x="654" y="1498" font-size="11" fill="#44525E">L</text>
  <rect x="80" y="1516" width="720" height="30" fill="#F8F6EE" stroke="#22303A" stroke-width="1.2"/>
  <line x1="201" y1="1516" x2="201" y2="1546" stroke="#22303A" stroke-width="0.8"/>
  <line x1="352" y1="1516" x2="352" y2="1546" stroke="#22303A" stroke-width="0.8"/>
  <line x1="473" y1="1516" x2="473" y2="1546" stroke="#22303A" stroke-width="0.8"/>
  <line x1="624" y1="1516" x2="624" y2="1546" stroke="#22303A" stroke-width="0.8"/>
  <line x1="668" y1="1516" x2="668" y2="1546" stroke="#22303A" stroke-width="0.8"/>
  <rect x="668" y="1516" width="52" height="30" fill="url(#hatch)"/>
  <text x="125" y="1536" font-size="11" fill="#44525E">S</text><text x="262" y="1536" font-size="11" fill="#44525E">L</text><text x="398" y="1536" font-size="11" fill="#44525E">S</text><text x="534" y="1536" font-size="11" fill="#44525E">L</text><text x="640" y="1536" font-size="11" fill="#44525E">S</text>
  <text x="80" y="1568" font-size="12" fill="#44525E">Pattern A: L-S-L-S-L (3 longs, 2 shorts, ~4.5" scrap) &#183; Pattern B: S-L-S-L-S (3 shorts, 2 longs, ~10.5" scrap)</text>
  <text x="80" y="1586" font-size="12" fill="#607283">If your yard carries 14-footers: 3 shorts + 3 longs fit one strip with ~4.4" scrap &#8212; one pattern, 1:1 built in.</text>

  <!-- ============ S5: CUT PLAN SUMMARY ============ -->
  <text x="50" y="1640" font-size="15" fill="#22303A" font-weight="bold">5 &#8212; CUT PLAN &#8212; 1,500 FRAMES OF EACH SIZE</text>
  <rect x="50" y="1656" width="780" height="404" fill="#F8F6EE" stroke="#22303A" stroke-width="1.2"/>
  <text x="70" y="1686" font-size="13" fill="#22303A" font-weight="bold">7&#215;7</text>
  <text x="70" y="1710" font-size="13" fill="#22303A">462 strips &#215; 13 rails = 6,006 rails &#8594; 154 boards, 1&#215;6&#215;8' (616 bd ft). Buy ~165. Waste &#8776; 2.2%.</text>
  <line x1="70" y1="1726" x2="810" y2="1726" stroke="#8FA3B8" stroke-width="1"/>
  <text x="70" y="1752" font-size="13" fill="#22303A" font-weight="bold">16&#215;20</text>
  <text x="70" y="1776" font-size="13" fill="#22303A">600 strips of Pattern A + 600 of Pattern B = 3,000 shorts + 3,000 longs</text>
  <text x="70" y="1800" font-size="13" fill="#22303A">&#8594; 400 boards, 1&#215;6&#215;8' (1,600 bd ft). Buy ~425. Waste &#8776; 4.7%.</text>
  <line x1="70" y1="1816" x2="810" y2="1816" stroke="#8FA3B8" stroke-width="1"/>
  <text x="70" y="1842" font-size="13" fill="#22303A" font-weight="bold">24&#215;30</text>
  <text x="70" y="1866" font-size="13" fill="#22303A">600 strips of Pattern A + 600 of Pattern B = 3,000 shorts + 3,000 longs</text>
  <text x="70" y="1890" font-size="13" fill="#22303A">&#8594; 400 boards, 1&#215;6&#215;12' (2,400 bd ft). Buy ~425. Waste &#8776; 5.2%.</text>
  <text x="70" y="1914" font-size="13" fill="#607283">14-ft option: 1,000 strips (3S+3L each) &#8594; 334 boards (2,338 bd ft), waste &#8776; 2.6%.</text>
  <line x1="70" y1="1930" x2="810" y2="1930" stroke="#8FA3B8" stroke-width="1"/>
  <text x="70" y="1956" font-size="13" fill="#22303A" font-weight="bold">Offcut harvest:</text>
  <text x="182" y="1956" font-size="13" fill="#22303A">the ~10-1/2" tails from the 24&#215;30 Pattern B strips each yield one 7&#215;7 rail</text>
  <text x="70" y="1980" font-size="13" fill="#22303A">(600 free rails &#8776; 15 fewer 7&#215;7 boards). Chop small rails from every tail before it hits the scrap bin.</text>
  <text x="70" y="2010" font-size="13" fill="#607283">All sizes: same rip (three 1-3/4" strips/board), same dado setup, panels cut 1/16" scant for tight miters.</text>
  <text x="70" y="2034" font-size="13" fill="#607283">Scaling: board counts are linear &#8212; for a different quantity, multiply by (qty &#247; 1,500).</text>
</svg>
